pipeline {
    agent any
    environment {
        DOCKER_CREDS = credentials('docker-creds')
        SONAR_TOKEN  = credentials('sonarqube-token')
        EC2_KEY      = credentials('ssh_user_and_key')
    }
    stages {
        stage('Build & Test & Sonar & Push Backend') {
            steps {
                sh '''
                ssh -o StrictHostKeyChecking=no -i $EC2_KEY_FILE ubuntu@44.222.128.246 << 'EOF'
                set -euo pipefail

                cd ~
                rm -rf user-handling-system
                git clone https://github.com/Kartik-yo/user-handling-system.git
                cd user-handling-system/backend

                echo "$DOCKER_CREDS_PSW" | docker login -u "$DOCKER_CREDS_USR" --password-stdin

                npm ci --legacy-peer-deps

          
                if npm test -- --silent; then
                    npm test -- --coverage --coverageReporters=lcov
                else
                    echo "No backend tests found – skipping coverage"
                fi

               
                sonar-scanner \
                  -Dsonar.projectKey=user-handling-system-backend \
                  -Dsonar.sources=. \
                  -Dsonar.host.url=http://3.236.244.98:9000 \
                  -Dsonar.login=$SONAR_TOKEN \
                  -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
                  -Dsonar.projectName="User Handling System – Backend"

             
                TAG=backend-${BUILD_NUMBER:-latest}
                docker build -t kartikmesh2406/user-handling-app:$TAG .
                docker push kartikmesh2406/user-handling-app:$TAG
                docker tag kartikmesh2406/user-handling-app:$TAG kartikmesh2406/user-handling-app:backend-latest
                docker push kartikmesh2406/user-handling-app:backend-latest

                echo "BACKEND PIPELINE SUCCESS"
                EOF
                '''
            }
        }
    }
}